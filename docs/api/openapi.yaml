openapi: 3.1.0
info:
  title: Jersey OS API
  version: 1.0.0
  description: Platform foundation HTTP contract for Jersey OS.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Rotate the refresh-token cookie and issue a new access token
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh rejected
        '429':
          description: Rate limited
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current refresh-token family
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
  /auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
  /auth/admin-probe:
    get:
      operationId: adminProbe
      tags: [Auth]
      summary: Authorization probe for platform.admin
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Authorized
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /system/health:
    get:
      operationId: getSystemHealth
      tags: [System]
      summary: Authenticated dependency health report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthResponse:
      type: object
      required: [accessToken, accessTokenExpiresAtUtc, user]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAtUtc:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, displayName, email, organizationId, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        organizationId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
    HealthStatus:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    HealthCheckResponse:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatus'
        description:
          type: string
          nullable: true
    SystemHealthResponse:
      type: object
      required: [status, checkedAt, checks]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checkedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckResponse'
