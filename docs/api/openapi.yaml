openapi: 3.1.0
info:
  title: Jersey OS API
  version: 1.0.0
  description: Platform, catalog, supplier import, and publishing HTTP contract for Jersey OS.
servers:
  - url: /api/v1
paths:
  /auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: Authenticate with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials
        '429':
          description: Rate limited
  /auth/refresh:
    post:
      operationId: refresh
      tags: [Auth]
      summary: Rotate the refresh-token cookie and issue a new access token
      responses:
        '200':
          description: Session refreshed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh rejected
        '429':
          description: Rate limited
  /auth/logout:
    post:
      operationId: logout
      tags: [Auth]
      summary: Revoke the current refresh-token family
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Logged out
        '401':
          description: Unauthorized
  /auth/me:
    get:
      operationId: getMe
      tags: [Auth]
      summary: Current authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Unauthorized
  /auth/admin-probe:
    get:
      operationId: adminProbe
      tags: [Auth]
      summary: Authorization probe for platform.admin
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Authorized
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /system/health:
    get:
      operationId: getSystemHealth
      tags: [System]
      summary: Authenticated dependency health report
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Health report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemHealthResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /catalog/products:
    get:
      operationId: searchProducts
      tags: [Catalog]
      summary: Search products
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: search
          schema: { type: string }
        - in: query
          name: status
          schema: { $ref: '#/components/schemas/ProductStatus' }
        - in: query
          name: teamId
          schema: { type: string, format: uuid }
        - in: query
          name: seasonId
          schema: { type: string, format: uuid }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, default: 20 }
      responses:
        '200':
          description: Paged products
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedProductsResponse'
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
    post:
      operationId: createProduct
      tags: [Catalog]
      summary: Create a draft product
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProductRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Validation or business rule failure
        '401':
          description: Unauthorized
        '403':
          description: Forbidden
  /catalog/products/{productId}:
    get:
      operationId: getProduct
      tags: [Catalog]
      summary: Get product detail
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
    put:
      operationId: updateProduct
      tags: [Catalog]
      summary: Update product details and taxonomy links
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProductRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/activate:
    post:
      operationId: activateProduct
      tags: [Catalog]
      summary: Activate a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Activated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '400':
          description: Activation rules failed
        '404':
          description: Not found
  /catalog/products/{productId}/archive:
    post:
      operationId: archiveProduct
      tags: [Catalog]
      summary: Archive a product
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/variants:
    put:
      operationId: upsertVariant
      tags: [Catalog]
      summary: Create or update a product variant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertVariantRequest'
      responses:
        '200':
          description: Product with variants
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/variants/{variantId}:
    delete:
      operationId: removeVariant
      tags: [Catalog]
      summary: Remove a product variant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - $ref: '#/components/parameters/VariantId'
      responses:
        '200':
          description: Product without the variant
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/images:
    post:
      operationId: attachProductImage
      tags: [Catalog]
      summary: Upload and attach a product image
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
                altText:
                  type: string
                sortOrder:
                  type: integer
      responses:
        '200':
          description: Product with images
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/images/order:
    put:
      operationId: reorderProductImages
      tags: [Catalog]
      summary: Reorder product images
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderImagesRequest'
      responses:
        '200':
          description: Reordered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/products/{productId}/images/{imageId}:
    delete:
      operationId: removeProductImage
      tags: [Catalog]
      summary: Remove a product image
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ProductId'
        - in: path
          name: imageId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Image removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProductResponse'
        '404':
          description: Not found
  /catalog/teams:
    get:
      operationId: listTeams
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Teams
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyItemResponse'
    post:
      operationId: createTeam
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyItemRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
  /catalog/teams/{id}:
    put:
      operationId: updateTeam
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaxonomyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonomyItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
        '404':
          description: Not found
  /catalog/seasons:
    get:
      operationId: listSeasons
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Seasons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyItemResponse'
    post:
      operationId: createSeason
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyItemRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
  /catalog/seasons/{id}:
    put:
      operationId: updateSeason
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaxonomyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonomyItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
        '404':
          description: Not found
  /catalog/categories:
    get:
      operationId: listCategories
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyItemResponse'
    post:
      operationId: createCategory
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyItemRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
  /catalog/categories/{id}:
    put:
      operationId: updateCategory
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaxonomyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonomyItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
        '404':
          description: Not found
  /catalog/tags:
    get:
      operationId: listTags
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaxonomyItemResponse'
    post:
      operationId: createTag
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaxonomyItemRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
  /catalog/tags/{id}:
    put:
      operationId: updateTag
      tags: [Catalog]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/TaxonomyId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTaxonomyItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaxonomyItemResponse'
        '404':
          description: Not found
  /inventory/variants/{variantId}/adjust:
    post:
      operationId: adjustInventory
      tags: [Inventory]
      summary: Adjust on-hand inventory for a variant
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/VariantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdjustInventoryRequest'
      responses:
        '200':
          description: Adjusted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InventoryResponse'
        '404':
          description: Not found
        '409':
          description: Concurrency conflict
  /import/suppliers:
    get:
      operationId: listSuppliers
      tags: [Import]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Suppliers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SupplierResponse'
    post:
      operationId: createSupplier
      tags: [Import]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSupplierRequest'
      responses:
        '200':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
  /import/suppliers/{supplierId}/feed:
    put:
      operationId: updateSupplierFeed
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: supplierId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSupplierFeedRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '404':
          description: Not found
  /import/suppliers/{supplierId}/sync:
    post:
      operationId: syncSupplierFeed
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - name: supplierId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Sync enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SupplierResponse'
        '404':
          description: Not found
  /import/batches:
    get:
      operationId: listImportBatches
      tags: [Import]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Import batches
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportBatchSummaryResponse'
    post:
      operationId: uploadImportBatch
      tags: [Import]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [supplierId, file]
              properties:
                supplierId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchSummaryResponse'
  /import/batches/{batchId}:
    get:
      operationId: getImportBatch
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: batchId
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Batch detail
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportBatchDetailResponse'
        '404':
          description: Not found
  /import/items/{itemId}:
    put:
      operationId: updateImportItem
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateImportItemRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportItemResponse'
        '404':
          description: Not found
  /import/items/{itemId}/approve:
    post:
      operationId: approveImportItem
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewImportItemRequest'
      responses:
        '200':
          description: Approved and applied
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportItemResponse'
        '404':
          description: Not found
  /import/items/{itemId}/reject:
    post:
      operationId: rejectImportItem
      tags: [Import]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: itemId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviewImportItemRequest'
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportItemResponse'
        '404':
          description: Not found
  /import/items/bulk-approve:
    post:
      operationId: bulkApproveImportItems
      tags: [Import]
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkApproveImportItemsRequest'
      responses:
        '200':
          description: Approved items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ImportItemResponse'
  /publishing/channels:
    get:
      operationId: listSalesChannels
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Sales channels
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SalesChannelResponse'
  /publishing/channels/{channelId}:
    put:
      operationId: setSalesChannelEnabled
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: path
          name: channelId
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetChannelEnabledRequest'
      responses:
        '200':
          description: Updated channel
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalesChannelResponse'
        '404':
          description: Not found
  /publishing/runs:
    get:
      operationId: listPublishRuns
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      parameters:
        - in: query
          name: productId
          required: false
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Publish runs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishRunResponse'
  /publishing/products/{productId}/runs:
    get:
      operationId: listProductPublishRuns
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Publish runs for a product
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PublishRunResponse'
  /publishing/products/{productId}/republish:
    post:
      operationId: republishProduct
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/ProductId'
      responses:
        '200':
          description: Republish enqueued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishRunResponse'
        '404':
          description: Not found
  /publishing/webhook-deliveries:
    get:
      operationId: listWebhookDeliveries
      tags: [Publishing]
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Recent Shopify webhook deliveries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WebhookDeliveryResponse'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    ProductId:
      in: path
      name: productId
      required: true
      schema: { type: string, format: uuid }
    VariantId:
      in: path
      name: variantId
      required: true
      schema: { type: string, format: uuid }
    TaxonomyId:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
    AuthResponse:
      type: object
      required: [accessToken, accessTokenExpiresAtUtc, user]
      properties:
        accessToken:
          type: string
        accessTokenExpiresAtUtc:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserResponse'
    UserResponse:
      type: object
      required: [id, displayName, email, organizationId, permissions]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        organizationId:
          type: string
          format: uuid
        permissions:
          type: array
          items:
            type: string
    HealthStatus:
      type: string
      enum: [Healthy, Degraded, Unhealthy]
    HealthCheckResponse:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
        status:
          $ref: '#/components/schemas/HealthStatus'
        description:
          type: string
          nullable: true
    SystemHealthResponse:
      type: object
      required: [status, checkedAt, checks]
      properties:
        status:
          $ref: '#/components/schemas/HealthStatus'
        checkedAt:
          type: string
          format: date-time
        checks:
          type: array
          items:
            $ref: '#/components/schemas/HealthCheckResponse'
    ProductStatus:
      type: string
      enum: [Draft, Active, Archived]
    TaxonomyItemResponse:
      type: object
      required: [id, name, slug]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        slug: { type: string }
