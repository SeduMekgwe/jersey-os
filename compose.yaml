name: jersey-os

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${JERSEYOS_SQL_PASSWORD:?Set JERSEYOS_SQL_PASSWORD in .env}
    ports:
      - "1433:1433"
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: src/JerseyOs.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__ConnectionString: Server=sqlserver,1433;Database=${JERSEYOS_DB:-JerseyOs};User Id=sa;Password=${JERSEYOS_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__DefaultOrganizationId: ${JERSEYOS_DEFAULT_ORGANIZATION_ID}
      Redis__ConnectionString: ${JERSEYOS_REDIS:-redis:6379}
      Jwt__Issuer: ${JERSEYOS_JWT_ISSUER}
      Jwt__Audience: ${JERSEYOS_JWT_AUDIENCE}
      Jwt__SigningKey: ${JERSEYOS_JWT_SIGNING_KEY}
      Bootstrap__Enabled: "true"
      Bootstrap__OrganizationName: ${JERSEYOS_BOOTSTRAP_ORGANIZATION}
      Bootstrap__AdminEmail: ${JERSEYOS_BOOTSTRAP_ADMIN_EMAIL}
      Bootstrap__AdminPassword: ${JERSEYOS_BOOTSTRAP_ADMIN_PASSWORD}
      Cors__AllowedOrigins__0: http://localhost:4173
      Cors__AllowedOrigins__1: http://localhost:5173
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    ports:
      - "8080:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8080/health/live"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: src/JerseyOs.Worker/Dockerfile
    environment:
      DOTNET_ENVIRONMENT: Development
      Database__ConnectionString: Server=sqlserver,1433;Database=${JERSEYOS_DB:-JerseyOs};User Id=sa;Password=${JERSEYOS_SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__DefaultOrganizationId: ${JERSEYOS_DEFAULT_ORGANIZATION_ID}
      Redis__ConnectionString: ${JERSEYOS_REDIS:-redis:6379}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4317}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: src/JerseyOs.Web
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    ports:
      - "4173:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.130.1
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./deploy/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    profiles: ["observability"]
    restart: unless-stopped

volumes:
  sql-data:
  redis-data:
